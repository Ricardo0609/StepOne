<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StepOne — Mis Metas</title>
  <link rel="icon" href="steponelogo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="app-header">
    <div class="header-brand">
      <span class="brand-icon">◈</span>
      <span class="brand-name">StepOne</span>
    </div>
    <a href="logros.html" class="btn-nav" aria-label="Ver mis logros">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 21h8m-4-4v4M4 7h16M4 7a2 2 0 0 1-2-2V3h20v2a2 2 0 0 1-2 2M4 7c0 6 3 10 8 10s8-4 8-10"/>
      </svg>
      <span>Logros</span>
    </a>
  </header>

  <main class="main-content">
    <section class="page-hero">
      <h1 class="page-title">Mis Metas</h1>
      <p class="page-subtitle" id="resumen"></p>
    </section>

    <section id="contenedor-metas" class="lista-metas" aria-label="Lista de metas"></section>

    <div class="empty-state oculto" id="empty-state">
      <div class="empty-icon">🎯</div>
      <p>Todavía no tienes metas.</p>
      <span>Presiona <strong>+</strong> para comenzar</span>
    </div>
  </main>

  <!-- FAB -->
  <button id="btn-agregar" class="fab" aria-label="Agregar nueva meta">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
      <path d="M12 5V19M5 12H19"/>
    </svg>
  </button>

  <!-- Modal: Añadir Meta -->
  <div id="overlay" class="overlay oculto" role="dialog" aria-modal="true" aria-label="Agregar nueva meta">
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal" id="modal-agregar">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <h2>Nueva Meta</h2>
        <button class="btn-close" id="btn-cancelar" aria-label="Cerrar modal">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="modal-body">
        <div class="form-group">
          <label for="inp-titulo">¿Qué quieres lograr?</label>
          <input id="inp-titulo" type="text" placeholder="Ej: Aprender React en 30 días" autocomplete="off" maxlength="100">
        </div>

        <div class="form-group">
          <label for="inp-descripcion">Descripción <span class="label-opt">(opcional)</span></label>
          <textarea id="inp-descripcion" placeholder="¿Por qué es importante esta meta?" rows="2" maxlength="300"></textarea>
        </div>

        <div class="form-group">
          <label>Pasos <span class="label-opt">(opcional)</span></label>
          <div class="pasos-input-row">
            <input id="inp-paso" type="text" placeholder="Añadir un paso..." autocomplete="off" maxlength="100">
            <button id="btn-add-paso" class="btn-add" aria-label="Añadir paso">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5V19M5 12H19"/></svg>
            </button>
          </div>
          <ul id="lista-pasos-temp" class="lista-pasos-temp" aria-label="Pasos añadidos"></ul>
        </div>

        <div class="form-group">
          <label for="inp-fecha">Fecha límite <span class="label-opt">(opcional)</span></label>
          <input id="inp-fecha" type="date">
        </div>
      </div>

      <div class="modal-footer">
        <button id="btn-guardar" class="btn-primary">Guardar Meta</button>
      </div>
    </div>
  </div>

  <!-- Modal: Detalle de Meta -->
  <div id="overlay-meta" class="overlay oculto" role="dialog" aria-modal="true" aria-label="Detalle de meta">
    <div class="modal-backdrop" id="meta-backdrop"></div>
    <div class="modal modal-detalle">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <h2 id="detalle-titulo" class="detalle-titulo-head">Meta</h2>
        <button class="btn-close" id="btn-cerrar-detalle" aria-label="Cerrar detalle">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="modal-body">
        <p id="detalle-desc" class="detalle-desc"></p>
        <div id="detalle-fecha" class="detalle-chip" style="display:none"></div>

        <div class="progress-block" id="progress-block">
          <div class="progress-label">
            <span>Progreso</span>
            <span id="detalle-progreso-text" class="progress-pct">0/0</span>
          </div>
          <div class="progress-bar-container">
            <div class="progress-bar-fill" id="detalle-progress-fill"></div>
          </div>
        </div>

        <ul id="detalle-pasos" class="detalle-pasos-lista" aria-label="Pasos de la meta"></ul>

        <div class="add-paso-inline">
          <input id="inp-paso-inline" type="text" placeholder="Añadir otro paso..." autocomplete="off" maxlength="100">
          <button id="btn-add-paso-inline" class="btn-add" aria-label="Añadir paso">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5V19M5 12H19"/></svg>
          </button>
        </div>
      </div>

      <div class="modal-footer footer-detalle">
        <button id="btn-completar-meta" class="btn-success">🏆 Marcar como Logro</button>
        <button id="btn-eliminar-meta" class="btn-danger-ghost" aria-label="Eliminar meta">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3,6 5,6 21,6"/><path d="M19,6l-1,14a2,2,0,0,1-2,2H8a2,2,0,0,1-2-2L5,6"/><path d="M10,11v6M14,11v6"/><path d="M9,6V4a1,1,0,0,1,1-1h4a1,1,0,0,1,1,1v2"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast oculto" role="status" aria-live="polite"></div>

  <script src="js.js"></script>
</body>
</html>
