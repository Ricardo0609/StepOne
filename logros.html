<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StepOne — Mis Logros</title>
  <link rel="icon" href="steponelogo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="app-header">
    <a href="index.html" class="btn-nav btn-back" aria-label="Volver a mis metas">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      <span>Metas</span>
    </a>
    <div class="header-brand">
      <span class="brand-icon">◈</span>
      <span class="brand-name">StepOne</span>
    </div>
  </header>

  <main class="main-content">
    <section class="page-hero">
      <h1 class="page-title">Mis Logros</h1>
      <p class="page-subtitle" id="resumen-logros"></p>
    </section>

    <section id="contenedor-logros" class="lista-metas" aria-label="Lista de logros"></section>

    <div class="empty-state oculto" id="empty-state-logros">
      <div class="empty-icon">🏆</div>
      <p>Aún no tienes logros.</p>
      <span>Completa una meta para verla aquí</span>
      <a href="index.html" class="btn-primary btn-link-primary">Ver mis metas</a>
    </div>
  </main>

  <!-- Modal: Detalle de Logro -->
  <div id="overlay-logro" class="overlay oculto" role="dialog" aria-modal="true" aria-label="Detalle de logro">
    <div class="modal-backdrop" id="logro-backdrop"></div>
    <div class="modal modal-detalle">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <h2 id="logro-titulo" class="detalle-titulo-head">Logro</h2>
        <button class="btn-close" id="btn-cerrar-logro" aria-label="Cerrar detalle">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="modal-body">
        <div class="logro-badge-grande" aria-hidden="true">🏆</div>
        <p id="logro-desc" class="detalle-desc"></p>
        <div id="logro-fecha-completado" class="detalle-chip chip-accent"></div>
        <ul id="logro-pasos" class="detalle-pasos-lista logro-pasos" aria-label="Pasos completados"></ul>
      </div>

      <div class="modal-footer footer-detalle">
        <button id="btn-eliminar-logro" class="btn-danger-ghost full-btn" aria-label="Eliminar logro">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3,6 5,6 21,6"/><path d="M19,6l-1,14a2,2,0,0,1-2,2H8a2,2,0,0,1-2-2L5,6"/><path d="M10,11v6M14,11v6"/><path d="M9,6V4a1,1,0,0,1,1-1h4a1,1,0,0,1,1,1v2"/></svg>
          Eliminar logro
        </button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast oculto" role="status" aria-live="polite"></div>

  <script src="js.js"></script>
</body>
</html>
